<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoachLens | AI Cricket Analysis</title>
    <meta name="description" content="AI-powered post-match analysis tool for amateur cricket coaches. Paste your scorecard, get a full coaching brief in 30 seconds." />
    <meta name="theme-color" content="#13161D" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA / Mobile specific tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Open Graph -->
    <meta property="og:title" content="CoachLens — AI Cricket Coach Intelligence" />
    <meta property="og:description" content="Paste your scorecard. Get a full coaching brief in 30 seconds. Player cards, team reports, and tactical decisions — powered by AI." />
    <meta property="og:type" content="website" />
    
    <!-- Favicon: Cricket ball SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8A020' stroke='%230D0F12' stroke-width='2'/%3E%3Cpath d='M8 8 Q16 16 8 24' fill='none' stroke='%230D0F12' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M24 8 Q16 16 24 24' fill='none' stroke='%230D0F12' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Prevent FOUC: apply theme before render -->
    <script>
      (function() {
        var t = localStorage.getItem('coachlens_theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (!t && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
